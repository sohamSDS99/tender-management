# Deployment classification. Checked in this order: hybrid, offline,
# mandatory on-premises, cloud required, cloud preferred, cloud allowed.
deployment:
  hybrid:
    label: Cloud and on-premises both permitted
    patterns:
      - "(cloud|saas|hosted)[^.]{0,60}(or|and or|and/or|as well as)[^.]{0,40}(on premise|on premises|locally (installed|hosted)|self hosted)"
      - "(on premise|on premises|self hosted|locally (installed|hosted))[^.]{0,60}(or|and or|and/or|as well as)[^.]{0,40}(cloud|saas|hosted)"
      - "optional(ly)?[^.]{0,40}(on premise|on premises|locally hosted|self hosted)"
      - "(on premise|on premises|local)[^.]{0,30}deployment (is )?(optional|also possible|an option)"
      - "either cloud or on premise"
      - "both cloud and on premise"
      - "hybrid (cloud|deployment|hosting)"
  offline_or_air_gapped:
    label: Offline / air-gapped operation required
    patterns:
      - "air gapped"
      - "air gap(ped)? (environment|network|deployment)"
      - "offline only (system|solution|operation)"
      - "(must|shall) (operate|function) (fully |entirely )?offline"
      - "no internet (connectivity|connection|access) (is )?(permitted|allowed)"
      - "internet connectivity is prohibited"
      - "without any internet connection"
  mandatory_on_premises:
    label: Mandatory on-premises deployment
    patterns:
      - "on premises only"
      - "on premise only"
      - "mandatory on premises( deployment)?"
      - "on premises deployment is mandatory"
      - "(must|shall) be installed on (the )?(customer|client|buyer|authority)s? (own )?servers"
      - "(must|shall) be installed (locally|on local servers|on our servers)"
      - "local server installation (is )?required"
      - "(must|shall) (operate|run|reside) entirely within the (buyer|authority|customer|client)s? (own )?data cent"
      - "self hosted only"
      - "no external cloud services"
      - "cloud (hosting|services) (is|are) (not permitted|prohibited|not allowed|excluded)"
      - "cloud solutions? (are|is) (not permitted|prohibited|not allowed|excluded)"
      - "deployment within government owned infrastructure only"
      - "all application components (must|shall) reside on the (buyer|authority|customer)s? network"
      - "source code (must|shall) be deployed and operated by the (buyer|authority|customer)"
      - "perpetual locally installed software only"
      - "(installed|hosted) exclusively (in|on|within) the (buyer|authority|customer|client)s? (own )?(data cent|network|infrastructure|servers)"
      - "exclusively (in|on|within) the (buyer|authority|customer|client)s? (own )?data cent"
  cloud_required:
    label: Cloud / SaaS explicitly required
    patterns:
      - "(cloud|saas) (deployment|hosting|delivery|solution|platform|service|model) (is |will be )?(required|mandatory|expected)"
      - "(must|shall|will) be (hosted|operated|delivered|provided|run) (by the )?(vendor|supplier|contractor|provider)"
      - "(hosted|provided|operated) by the (vendor|supplier|contractor) as (a )?(managed )?(cloud|saas|service)"
      - "(must|shall|will) be (hosted )?in the cloud"
      - "(plataforma|solucao|software|sistema|servico) em nuvem"
      - "software como servico"
      - "(plataforma|solucion|sistema|software) en la nube"
      - "en mode saas"
      - "(loesung|losung|plattform|software|system) in der cloud"
      - "(must|shall) be (a )?(cloud|saas|software as a service)"
      - "(cloud|saas) (based )?(solution|platform|system|software|service) (is )?(required|mandatory)"
      - "(must|shall) be (cloud based|cloud hosted|vendor hosted|supplier hosted|fully hosted)"
      - "(must|shall) be (delivered|provided) as (a )?(software as a service|saas|cloud service)"
      - "(only|exclusively) (cloud|saas) (based )?(solutions|offers|proposals)"
      - "software as a service (saas )?(model|basis|solution) (is )?(required|mandatory)"
  cloud_preferred:
    label: Cloud / SaaS preferred
    patterns:
      - "(cloud|saas)[^.]{0,30}(is|are) (preferred|preferable|desirable|favoured|favored)"
      - "prefer(ably|red)?[^.]{0,30}(cloud|saas|hosted) (solution|platform|service|based)"
      - "(cloud|saas) first"
  cloud_allowed:
    label: Cloud / SaaS permitted
    patterns:
      - "(will|would|can|may) consider[^.]{0,50}(cloud|saas|software as a service|hosted)"
      - "(cloud|saas|software as a service)[^.]{0,30}(subscription|licence|license) (is |would be )?(acceptable|considered|welcome)"
      - "(cloud|saas|hosted)[^.]{0,30}(is|are) (permitted|allowed|acceptable|accepted|possible)"
      - "may be (cloud|saas|vendor) hosted"
      - "(cloud|saas) (deployment|hosting) (is )?(permitted|allowed|acceptable|an option)"

# Deployment nuances that need a human, not an automatic rejection.
deployment_review:
  patterns:
    - "private cloud"
    - "community cloud"
    - "government cloud"
    - "sovereign cloud"
    - "g cloud"
    - "data (must|shall) (be |remain )?(stored |hosted )?(only |exclusively )?(with)?in (the )?(eu|eea|uk|country|national territory)"
    - "hosting (provider|environment) (selected|chosen|provided) by the (buyer|authority|customer|client)"
    - "(buyer|authority|customer)s? own (tenant|subscription|azure|aws|cloud) (environment|account|tenancy)"
    - "iso 27001 certification (is )?(required|mandatory)"
  reason: "Hosting model needs review (private/government cloud or buyer-provided hosting)"

