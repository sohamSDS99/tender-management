# ---------------------------------------------------------------------------
# Relevance configuration for the tender monitor.
#
# Company profile: cloud-hosted SaaS platform for Safety Data Sheet (SDS)
# management / authoring / distribution, chemical & GHS compliance and EHS
# management (incidents, inspections, audits, CAPA, risk, contractor safety).
# A tender that mandates on-premises / offline / air-gapped delivery is not a
# suitable opportunity.
#
# MATCHING CONTRACT (important when editing this file)
#   * Every phrase and every regex below is matched against *normalized* text:
#     lower-cased, accents folded (ficha -> ficha, données -> donnees),
#     punctuation replaced by single spaces, whitespace collapsed.
#     So write "cloud based platform", never "cloud-based platform";
#     write "buyers data centre", never "buyer's data center".
#   * Phrases are matched on whole-word boundaries (the normalizer guarantees
#     single spaces, so a padded substring search is boundary-safe).
#   * `patterns:` entries are Python regular expressions over the same text.
# ---------------------------------------------------------------------------
version: 3

weights:
  # Final score = topic*0.55 + product/deployment fit*0.30 + procurement intent*0.15
  topic: 0.55
  product_fit: 0.30
  procurement_intent: 0.15
  # Per-phrase points inside a profile.
  phrase_points: {strong: 26, medium: 12, weak: 5}
  # A hit in the title counts this much more than a hit in the description.
  title_multiplier: 1.9
  buyer_context_points: 6      # buyer name looks like a chemical/EHS/IT authority
  # Distinct-concept bonus: more separate relevant concepts => higher confidence.
  distinct_concept_points: 5
  distinct_concept_max: 20
  # A second profile scoring above `module_threshold` adds cross-module credit.
  secondary_profile_ratio: 0.28
  module_threshold: 25
  module_bonus: 7
  module_bonus_max: 21
  classification_code_points: 12
  classification_code_max: 24
  # Multiplier applied to the *final* score when the deadline has passed or the
  # notice is cancelled/awarded. The topic subscore is kept intact.
  expired_multiplier: 0.65
  cancelled_multiplier: 0.7

bands:                  # display bands / fit_status thresholds
  excellent_fit: 85     # -> high_fit
  good_fit: 70          # -> good_fit
  possible_fit: 50      # -> possible_fit
  weak_fit: 25          # 25-49 is "weak fit" and reported as not_fit
  manual_review_min: 50 # review triggers below this stay in their band

# Hard ceilings on the final score. The lowest applicable cap wins.
caps:
  mandatory_on_premises: 20
  offline_or_air_gapped: 20
  chemical_purchase_sds_doc: 15
  ehs_service_no_software: 35
  physical_equipment_or_ppe: 10
  unrelated_sds_acronym: 15

