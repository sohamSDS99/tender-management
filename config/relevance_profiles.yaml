# ---------------------------------------------------------------------------
# Ambiguous acronym handling. "SDS" only counts when chemical/regulatory
# context appears within `window` characters.
# ---------------------------------------------------------------------------
ambiguous_acronyms:
  sds:
    window: 200
    cap_key: unrelated_sds_acronym
    flag_when_missing_context: true
    context_terms:
      - chemical
      - chemicals
      - hazard
      - hazardous
      - ghs
      - msds
      - safety data sheet
      - safety data sheets
      - authoring
      - distribution
      - regulatory
      - reach
      - clp
      - whmis
      - chemical inventory
      - substance
      - substances
      - mixture
      - label
      - labelling
      - labeling
      - exposure scenario
      - poison
      - hazcom
      - coshh
      - sicherheitsdatenblatt
      - fiche de donnees de securite
      - ficha de datos de seguridad
      - ficha de dados de seguranca
    unrelated_patterns:
      - "software defined storage"
      - "software defined (networking|data cent)"
      - "structured data service"
      - "sales data service"
      - "sds page"
      - "students for a democratic society"
    missing_context_flag: "The abbreviation 'SDS' appears without chemical, hazard or regulatory context - confirm the meaning"
    unrelated_reason: "'SDS' is used in an unrelated sense (e.g. software-defined storage)"
  reach:
    # "reach" is an ordinary English verb; only count it as the EU REACH
    # regulation when chemical/regulatory context is nearby. No review flag:
    # the plain-English use is far too common to be worth surfacing.
    window: 150
    flag_when_missing_context: false
    context_terms:
      - chemical
      - chemicals
      - substance
      - substances
      - mixture
      - mixtures
      - clp
      - ghs
      - echa
      - svhc
      - annex
      - regulation
      - registration
      - authorisation
      - authorization
      - restriction
      - safety data sheet
      - safety data sheets
      - msds
      - sds
      - exposure scenario
      - candidate list
      - 1907
      - 2006
      - compliance
    unrelated_patterns: []

# ---------------------------------------------------------------------------
# False positives. Each group caps the final score unless the tender also
# shows genuine software-platform intent (see `software_override`).
# ---------------------------------------------------------------------------
false_positives:
  chemical_purchase_sds_doc:
    reason: "Buying chemicals/materials where an SDS is only a required delivery document, not an SDS platform"
    cap_key: chemical_purchase_sds_doc
    software_override: true
    patterns:
      - "(supply|delivery|purchase|provision|procurement) of [^.]{0,60}(chemical|chemicals|reagent|reagents|solvent|solvents|paint|paints|fuel|diesel|petrol|lubricant|cleaning (product|agent|material)|detergent|disinfectant|gas cylinder|laboratory (consumable|supplies|product))"
      - "(safety data sheet|safety data sheets|sds|msds)[^.]{0,60}(must|shall|should|to) be (provided|supplied|submitted|attached|included|delivered|made available) (with|for|to)"
      - "(supplier|contractor|tenderer|bidder|vendor)s? (must|shall|should|is required to) (provide|supply|submit|attach|upload|include)[^.]{0,60}(safety data sheet|safety data sheets|sds|msds)"
      - "(accompanied|together) (by|with)[^.]{0,40}(safety data sheet|safety data sheets|msds)"
      - "upload[^.]{0,40}(safety data sheet|sds|msds) as[^.]{0,30}attachment"
      - "(safety data sheet|sds|msds)[^.]{0,40}(for (each|every|all) (chemical|product|item|substance) (delivered|supplied|offered))"
      - "(copies of|copy of) (the )?(safety data sheets|safety data sheet|msds)[^.]{0,40}(shall|must|to) be"
      - "product safety documentation (must|shall) be (provided|submitted)"
  ehs_service_no_software:
    reason: "EHS consultancy, training or staffing rather than an EHS software platform"
    cap_key: ehs_service_no_software
    software_override: true
    patterns:
      - "(safety|ehs|hse) (training|awareness training|induction training) (courses?|services?|programme|program)"
      - "provision of (safety|ehs|hse|health and safety) (training|consultancy|consulting|advisory) services"
      - "(appointment|provision|supply) of (a )?(safety officer|safety officers|safety advisor|safety adviser|hse officer|health and safety consultant)"
      - "(construction|site) safety (supervision|supervisor|inspector)"
      - "environmental impact (study|studies|assessment|assessments)"
