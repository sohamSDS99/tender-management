[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ['slow: spawns a subprocess; deselect with -m "not slow"']

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "W"]
ignore = ["B008", "E501", "C408"]  # FastAPI Depends() defaults; long config lines; kwargs dicts
