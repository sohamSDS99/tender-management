# Gate for every push and pull request: the same checks the definition of done
# names, so a green tick here means the acceptance list still holds.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — tests, lint, migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tender
          POSTGRES_PASSWORD: tender
          POSTGRES_DB: tenders
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tender -d tenders"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        working-directory: backend
        run: pytest -q

      - name: Migrations from empty — SQLite
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/ci-sqlite.db
        run: |
          rm -f /tmp/ci-sqlite.db
          alembic upgrade head
          alembic current

      - name: Migrations from empty — PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://tender:tender@localhost:5432/tenders
        run: |
          alembic upgrade head
          alembic current
          # Prove it is reversible, then reapply.
          alembic downgrade base
          alembic upgrade head

      - name: Entrypoint smoke test — seed replay, payload rendered, not posted
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://tender:tender@localhost:5432/tenders
          PUBLIC_APP_URL: http://localhost:8080
        run: |
          python -m app.jobs.scheduled_fetch --seed --seed-reset --dry-run-notify --json > report.json
          python - <<'PY'
          import json
          report = json.load(open("report.json"))
          note = report["notification"]
          assert report["exit_code"] == 0, report
          assert report["seeded"] == 14, report["seeded"]
          assert note["status"] == "dry_run", note
          assert note["candidates"] >= 1, note
          assert note["payload"]["blocks"], note
          assert len(note["payload"]["blocks"]) <= 50, len(note["payload"]["blocks"])
          print("entrypoint smoke test ok:", note["candidates"], "candidates")
          PY

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (tsc --noEmit)
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Formatting
        working-directory: frontend
        run: npm run format:check

      - name: Build
        working-directory: frontend
        run: npm run build

  workflows:
    name: Workflow files — actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
